<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>忘れた頃チェック｜科目5</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#172b38;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#106c81;color:white;padding:18px 18px 14px}header h1{font-size:22px;margin:0}header p{margin:5px 0 0;font-size:13px}main{max-width:720px;margin:auto;padding:15px 14px 70px}.card{background:white;border:1px solid #dce5eb;border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 2px 7px #1227330c}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}p{line-height:1.65}.muted{color:#607280;font-size:13px}.tag{display:inline-block;background:#e5f2f6;color:#165c71;border-radius:99px;padding:3px 9px;font-size:12px;margin-right:5px}button,select{font:inherit}button{border:1px solid #b9ced6;background:white;color:#12556b;border-radius:11px;padding:12px 14px;cursor:pointer;font-weight:600}button.primary{background:#087b91;color:white;border-color:#087b91}button.danger{color:#a63e3e}button:disabled{opacity:.45}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid #cad8df;border-radius:10px;background:white;color:#172b38;font-weight:400}.opt.chosen{background:#dcf2f7;border-color:#0085a4;font-weight:700}.opt.correct{border-color:#20966b;background:#e6f7ee}.opt.wrong{border-color:#d47777;background:#fff0f0}.progress{height:8px;background:#e3ebee;border-radius:9px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#0b899f}label{display:block;margin:8px 0}.small{font-size:12px}select{padding:10px;border-radius:9px;max-width:100%}.qrow{border-top:1px solid #e4eaee;padding:12px 0}.qrow:first-child{border-top:0}input[type=checkbox]{width:19px;height:19px;vertical-align:middle}.stat{display:flex;flex-wrap:wrap;gap:8px}.stat span{background:#edf5f7;border-radius:9px;padding:9px 12px;font-size:13px}#notice{color:#8b4b16;font-size:13px}details{margin-top:8px}summary{cursor:pointer;color:#126b82}</style></head><body><header><h1>📘 忘れた頃チェック</h1><p>科目5「言語と心理」｜試作版 v0.1</p></header><main id="app"></main><script>const QUESTIONS=[{"id": "K5-021", "topic": "学習ストラテジー", "level": "標準", "stem": "言いたい語が思い出せず、別の表現で説明する方略はどれか。", "options": ["体制化", "維持リハーサル", "回避", "言い換え"], "answer": 3, "explanation": "語を思い出せない場合に別の表現で伝えるのはコミュニケーション・ストラテジーの言い換え。"}, {"id": "K5-004", "topic": "異文化理解", "level": "標準", "stem": "ステレオタイプの説明として適切なのはどれか。", "options": ["言語能力の伸びを予測する統計モデル", "異文化交流の不安を測定する検査法", "個人の経験を細かく記録する観察法", "集団に対する固定的で単純化された見方"], "answer": 3, "explanation": "集団の構成員に画一的な特徴を当てはめる見方。"}, {"id": "K5-012", "topic": "学習と教授", "level": "基礎", "stem": "発達の最近接領域の説明として適切なのはどれか。", "options": ["学習者同士が同じ答えを選ぶ割合", "過去に学習した内容を忘れてしまう時間帯", "習得した技能が完全に自動化した状態", "一人でできることと援助があればできることの隔たり"], "answer": 3, "explanation": "独力での達成水準と支援下での達成水準の差に着目する。"}, {"id": "K5-022", "topic": "第二言語習得", "level": "発展", "stem": "クラッシェンの情意フィルター仮説に照らして適切な説明はどれか。", "options": ["教師の発話が長いと、記憶容量が拡大すると考える", "不安や緊張が高いと、入力が習得に結びつきにくくなると考える", "文法知識が増えると、言語使用の機会が減ると考える", "発音の違いが大きいと、母語の使用が増えると考える"], "answer": 1, "explanation": "情意要因が言語入力の習得への利用を妨げる可能性を説明する仮説。"}, {"id": "K5-014", "topic": "学習と教授", "level": "標準", "stem": "Focus on Form（FonF）の特徴として適切なのはどれか。", "options": ["文法説明を行わず発音矯正だけを実施する", "形式への注意を避け意味の理解だけを扱う", "意味中心の活動の中で必要に応じ形式へ注意を向ける", "言語形式を独立した項目として順番に練習する"], "answer": 2, "explanation": "意味を伝える活動の中で、言語形式にも注意を向ける。"}, {"id": "K5-010", "topic": "記憶と認知", "level": "標準", "stem": "精緻化リハーサルの例として適切なのはどれか。", "options": ["新語を既知の経験や概念と関連づける", "新語の出現順を毎回無作為に変える", "新語の表記を一度だけ眺めて終える", "新語の音を意味を考えず繰り返す"], "answer": 0, "explanation": "既存の知識と意味的に結びつけて処理する。"}, {"id": "K5-002", "topic": "異文化理解", "level": "標準", "stem": "文化相対主義に近い態度はどれか。", "options": ["文化の慣習をその文化の文脈で理解する", "異文化の行動を同じ性格特性に帰する", "自文化の基準で他文化の優劣を決める", "文化差を無視して同じ対応を求める"], "answer": 0, "explanation": "文化相対主義は文化をその文脈に即して理解しようとする立場。"}, {"id": "K5-018", "topic": "動機づけとバイリンガル", "level": "基礎", "stem": "道具的動機付けの例として適切なのはどれか。", "options": ["日本語話者の共同体の一員になりたくて学ぶ", "日本語を使う活動そのものが楽しくて学ぶ", "日本語の響き自体が好きで学ぶ", "就職に必要な資格を取るために日本語を学ぶ"], "answer": 3, "explanation": "就職・進学など実用的な目的に向けた動機づけ。"}, {"id": "K5-001", "topic": "異文化理解", "level": "基礎", "stem": "カルチャーショックについて最も適切なのはどれか。", "options": ["異文化への接触で生じる戸惑いや心理的負担", "母文化に戻った際に起こる記憶力の変化", "異文化に接する前に生じる言語能力の低下", "文化の違いを意図的に消去する学習方法"], "answer": 0, "explanation": "異文化環境で慣れた規範が通用しないことなどから戸惑いや不安が生じる。"}, {"id": "K5-019", "topic": "動機づけとバイリンガル", "level": "標準", "stem": "カミンズのBICSとCALPの区別として適切なのはどれか。", "options": ["聞く技能に関わる能力と話す技能に関わる能力", "文字の認識能力と身体動作による表現能力", "日常の対人会話に関わる能力と学習活動で求められる言語能力", "母語での読解能力と外国語での発音能力"], "answer": 2, "explanation": "BICSは日常の対人的なコミュニケーション、CALPは学習に関わる認知的・学術的言語能力を指す。"}, {"id": "K5-007", "topic": "コミュニケーション", "level": "標準", "stem": "DIE法の三段階の組み合わせとして適切なのはどれか。", "options": ["定義・推論・実験", "発見・模倣・実行", "記述・解釈・評価", "対話・統合・共感"], "answer": 2, "explanation": "Description（記述）、Interpretation（解釈）、Evaluation（評価）を区別する。"}, {"id": "K5-020", "topic": "学習ストラテジー", "level": "標準", "stem": "自分の学習目標を立て、理解度を点検し、方法を修正する行動はどれか。", "options": ["社会的ストラテジー", "メタ認知ストラテジー", "記憶ストラテジー", "補償ストラテジー"], "answer": 1, "explanation": "メタ認知ストラテジーは学習の計画・監視・評価に関わる。"}, {"id": "K5-011", "topic": "記憶と認知", "level": "標準", "stem": "文章理解で、既有知識を使って内容を予測しながら読む処理はどれか。", "options": ["手続き的記憶", "維持リハーサル", "トップダウン処理", "ボトムアップ処理"], "answer": 2, "explanation": "トップダウン処理は既有知識や期待を活用して理解する。"}, {"id": "K5-023", "topic": "学習と教授", "level": "発展", "stem": "学習者が会話の中で意味を確認し、相手に言い直しを求める活動と特に関係が深い仮説はどれか。", "options": ["自然順序仮説", "インターアクション仮説", "臨界期仮説", "有標性差異仮説"], "answer": 1, "explanation": "相互作用の中で生じる意味交渉が習得に寄与すると考える。"}, {"id": "K5-009", "topic": "記憶と認知", "level": "標準", "stem": "「チャンク」の考え方に合う例はどれか。", "options": ["数字列を意味のあるまとまりに区切って覚える", "数字列を音読せず視覚だけで覚える", "数字列を毎回逆順にしてから覚える", "数字列を時間を空けず無作為に並べる"], "answer": 0, "explanation": "複数の情報を意味のある単位にまとめると記憶負荷を軽減し得る。"}, {"id": "K5-003", "topic": "異文化理解", "level": "基礎", "stem": "高コンテクスト・コミュニケーションの特徴はどれか。", "options": ["状況や共有知識への依存が比較的大きい", "文字情報を音声情報より優先して伝える", "相手の背景を考慮せず情報を伝える", "意味を明示的な言語表現だけで伝える"], "answer": 0, "explanation": "共有された文脈や関係性などが意味解釈に大きく関わる。"}, {"id": "K5-006", "topic": "コミュニケーション", "level": "標準", "stem": "会話中、うなずきや視線で相手の発話を促す非言語行動は何に近いか。", "options": ["アダプター", "レギュレーター", "エンブレム", "イラストレーター"], "answer": 1, "explanation": "レギュレーターは会話の進行や発話交替の調整に関わる。"}, {"id": "K5-017", "topic": "第二言語習得", "level": "標準", "stem": "「ミステイク」と「エラー」の一般的な区別として適切なのはどれか。", "options": ["ミステイクは書き言葉、エラーは話し言葉に生じる誤り", "ミステイクは母語話者、エラーは学習者に生じる誤り", "ミステイクは一時的な言い損じ、エラーは知識体系に関わる誤り", "ミステイクは発音、エラーは語彙に限られる誤り"], "answer": 2, "explanation": "ミステイクは知識があっても起こる遂行上の誤り、エラーは体系的な知識の不足等に関わる。"}, {"id": "K5-008", "topic": "記憶と認知", "level": "基礎", "stem": "ワーキングメモリの説明として最も適切なのはどれか。", "options": ["経験を生涯にわたり固定保存する仕組み", "情報を一時保持しながら処理する仕組み", "身体動作を反射的に制御する仕組み", "言語の音だけを恒久的に記録する仕組み"], "answer": 1, "explanation": "一時的な保持と情報処理を組み合わせる機能を指す。"}, {"id": "K5-015", "topic": "第二言語習得", "level": "基礎", "stem": "第二言語習得で「負の転移」と呼ぶ現象はどれか。", "options": ["教師の助言で学習方略が改善する", "母語の特徴が目標言語の使用に不適切な影響を与える", "既習知識が新しい学習を円滑に進める", "学習者が複数の言語を切り替えて使う"], "answer": 1, "explanation": "既習言語の特徴が目標言語での誤りにつながる場合などを指す。"}, {"id": "K5-013", "topic": "学習と教授", "level": "標準", "stem": "スキャフォールディングに当たる指導はどれか。", "options": ["学習者の誤答を記録せず次の単元に進める", "教師の説明を減らして評価をすべて廃止する", "学習者の習熟に応じて支援を調整し徐々に減らす", "課題の難易度に関係なく同じヒントを与え続ける"], "answer": 2, "explanation": "必要な足場かけを提供し、自立に応じて支援を減らす。"}, {"id": "K5-016", "topic": "第二言語習得", "level": "標準", "stem": "中間言語の説明として適切なのはどれか。", "options": ["母語と目標言語を同時通訳する技術", "二言語を完全に同じ水準で使う能力", "言語を使わずに意思疎通する手段", "学習者が発達させる独自の言語体系"], "answer": 3, "explanation": "学習者の言語は母語や目標言語そのものではない発達途上の体系と捉えられる。"}, {"id": "K5-005", "topic": "コミュニケーション", "level": "基礎", "stem": "ハイムズが提起した「コミュニケーション能力」が重視する点はどれか。", "options": ["文字を読まずに会話だけで学ぶ訓練", "発音の正確さだけを中心とした測定", "語彙数だけによる言語運用能力の評価", "文法規則に加えて状況に応じた適切な使用"], "answer": 3, "explanation": "文法的に可能であることだけでなく、場面に応じて適切に使えることを含む。"}, {"id": "K5-024", "topic": "異文化理解", "level": "発展", "stem": "DIE法に沿って「相手が目を合わせなかった」を最初に扱うとき、最も適切なのはどれか。", "options": ["目を合わせなかったという観察事実を記述する", "相手は緊張していたと解釈を確定する", "相手は無礼な人だと評価を先に確定する", "相手の文化には問題があると結論づける"], "answer": 0, "explanation": "観察できた事実（Description）と解釈・評価を区別する。"}];const KEY='wasureta_k5_v01';let state;function fresh(){return {session:null,records:{},history:[]}}try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}const $=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function q(id){return QUESTIONS.find(x=>x.id===id)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function home(){let rec=Object.values(state.records),done=rec.filter(x=>x.stage==='graduated').length,master=rec.filter(x=>x.stage==='mastered').length,weak=rec.filter(x=>x.stage!=='graduated'&&x.stage!=='mastered').length;let s=state.session;$.innerHTML=`<div class="card"><h2>学習状況</h2><div class="stat"><span>収録 ${QUESTIONS.length}問</span><span>初回卒業 ${done}</span><span>克服済み ${master}</span><span>未習得・復習中 ${weak}</span></div><p class="muted">初回は確信があるときだけ答え、迷ったら空欄に。採点は全問終了後にまとめて行います。</p>${s?`<p>途中保存：${s.mode==='initial'?'初回診断':'忘れた頃チェック'} ${s.index+1}/${s.ids.length}問</p><button class="primary" onclick="showTest()">続きから再開</button>`:''}</div><div class="card"><h2>初回診断</h2><p class="muted">未診断の問題から出題。出題順は開始時に固定します。</p><label>問題数 <select id="count"><option value="5">5問</option><option value="10">10問</option><option value="20" selected>20問</option><option value="24">全問</option></select></label><div class="actions"><button class="primary" onclick="startInitial()" ${s?'disabled':''}>初回診断を開始</button></div></div><div class="card"><h2>未習得問題の学習</h2><p class="muted">解説を読んでから、好きな問題を選んで復習テストに進めます。</p><button onclick="showStudy()">問題一覧・復習へ</button></div><div class="card"><h2>苦手分野</h2>${topicSummary()}</div><div class="card"><h2>データ保存</h2><div class="actions"><button onclick="exportData()">JSONバックアップを書き出す</button><label style="border:1px solid #b9ced6;border-radius:11px;padding:12px;color:#12556b;font-weight:600">バックアップを読み込む<input type="file" accept=".json,application/json" onchange="importData(event)" style="display:none"></label></div><p class="muted">この端末のブラウザに自動保存。Safariのデータ削除に備え、定期的にJSONを書き出してください。</p><details><summary>試作版の注意点</summary><p class="muted">現在24問の動作検証用。7教程を完全網羅していません。復習2回目の応用問題は未実装のため、この版では「克服済み」にはしません。誤答・空欄は学習対象に残ります。問題の正確性は追加検証が必要です。</p></details></div>`}function topicSummary(){let names=[...new Set(QUESTIONS.map(x=>x.topic))];return names.map(t=>{let a=QUESTIONS.filter(x=>x.topic===t&&state.records[x.id]);let w=a.filter(x=>!['graduated','mastered'].includes(state.records[x.id].stage));return `<div class="qrow"><b>${esc(t)}</b> <span class="muted">${a.length?`${w.length}/${a.length}問が未習得・復習中`:'未診断'}</span> ${w.length?`<button onclick="showStudy('${esc(t)}')">学習へ</button>`:''}</div>`}).join('')}function startInitial(){if(state.session)return;let pool=shuffle(QUESTIONS.filter(x=>!state.records[x.id]));if(!pool.length){alert('全問診断済みです');return}let n=Number(document.getElementById('count').value);state.session={mode:'initial',ids:pool.slice(0,n).map(x=>x.id),index:0,answers:{},orders:{}};save();showTest()}function showTest(){let s=state.session;if(!s)return home();let x=q(s.ids[s.index]);if(!s.orders[x.id]){s.orders[x.id]=shuffle([0,1,2,3]);save()}let order=s.orders[x.id],chosen=s.answers[x.id];$.innerHTML=`<div class="card"><div class="muted">${s.mode==='initial'?'初回診断':'忘れた頃チェック'}｜${s.index+1}/${s.ids.length}問</div><div class="progress"><div style="width:${(s.index+1)/s.ids.length*100}%"></div></div><span class="tag">${esc(x.topic)}</span><span class="tag">${esc(x.level)}</span><h2 style="margin-top:13px">${esc(x.stem)}</h2>${order.map((idx,i)=>`<button class="opt ${chosen===idx?'chosen':''}" onclick="choose(${idx})">${'ABCD'[i]}. ${esc(x.options[idx])}</button>`).join('')}<div class="actions"><button onclick="choose(null)" ${chosen===null?'disabled':''}>空欄にする</button><button onclick="move(-1)" ${s.index===0?'disabled':''}>前の問題</button><button class="primary" onclick="move(1)">${s.index===s.ids.length-1?'採点する':'次の問題'}</button></div><p class="muted">選択肢の順番はこのテスト中固定。途中で閉じても再開できます。</p></div>`}function choose(idx){state.session.answers[state.session.ids[state.session.index]]=idx;save();showTest()}function move(d){let s=state.session;if(d===1&&s.index===s.ids.length-1){if(!confirm('このテストを採点しますか？ 未回答は空欄として扱います。'))return;grade();return}s.index+=d;save();showTest()}function grade(){let s=state.session,results=[];for(let id of s.ids){let x=q(id),v=Object.prototype.hasOwnProperty.call(s.answers,id)?s.answers[id]:null,ok=v===x.answer,rec=state.records[id]||{attempts:0};rec.attempts++;if(s.mode==='initial'){rec.stage=ok?'graduated':'unmastered'}else if(rec.stage!=='graduated'){rec.stage=ok?'reviewing':'unmastered'}rec.last=Date.now();state.records[id]=rec;results.push({id,answer:v,ok})}state.history.push({date:Date.now(),mode:s.mode,results});state.session=null;save();showResults(results,s.orders,s.mode)}function showResults(results,orders,mode){let good=results.filter(r=>r.ok).length;$.innerHTML=`<div class="card"><h2>一括採点結果</h2><p><strong>${good} / ${results.length} 問正解</strong></p><p class="muted">誤答・空欄は未習得として保存。復習の正解も、応用問題で確認するまでは克服済みにしません。</p><button class="primary" onclick="showStudy()">未習得問題を学習する</button> <button onclick="home()">ホーム</button></div>${results.map((r,i)=>{let x=q(r.id),ord=orders[r.id];return `<div class="card"><span class="tag">${i+1}問目</span><span class="tag">${r.ok?'正解':r.answer===null?'空欄':'誤答'}</span><h3 style="margin-top:10px">${esc(x.stem)}</h3><p class="small">正解：${'ABCD'[ord.indexOf(x.answer)]}. ${esc(x.options[x.answer])}</p><p class="muted">${esc(x.explanation)}</p></div>`}).join('')}`}
function showStudy(filter=''){let pool=QUESTIONS.filter(x=>state.records[x.id]&&!['graduated','mastered'].includes(state.records[x.id].stage));if(filter)pool=pool.filter(x=>x.topic===filter);window._studyIds=pool.map(x=>x.id);$.innerHTML=`<div class="card"><h2>未習得問題の学習</h2><p class="muted">問題と解説を確認できます。復習する問題にチェックを入れてください。テスト中は解説を表示しません。</p><button onclick="home()">ホームへ戻る</button><div class="actions"><button onclick="document.querySelectorAll('.pick').forEach(x=>x.checked=true)">すべて選択</button><button onclick="document.querySelectorAll('.pick').forEach(x=>x.checked=false)">選択解除</button></div><div class="actions"><button class="primary" onclick="startReview()" ${state.session?'disabled':''}>選んだ問題で忘れた頃チェック</button></div></div>${pool.length?pool.map(x=>`<div class="card"><label><input type="checkbox" class="pick" value="${x.id}"> <b>${esc(x.topic)}｜${esc(x.level)}</b></label><h3>${esc(x.stem)}</h3><p>正解：${esc(x.options[x.answer])}</p><p class="muted">${esc(x.explanation)}</p><span class="tag">${state.records[x.id].stage==='reviewing'?'復習中':'未習得'}</span></div>`).join(''):'<div class="card"><p>この条件の未習得問題はありません。</p></div>'}`}function startReview(){if(state.session)return;let ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length){alert('復習する問題を選択してください');return}state.session={mode:'review',ids:shuffle(ids),index:0,answers:{},orders:{}};save();showTest()}function exportData(){let blob=new Blob([JSON.stringify({app:'wasureta-k5',version:1,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wasureta_k5_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(o.app!=='wasureta-k5'||!o.state||!o.state.records||!o.state.history)throw Error('形式が異なります');if(confirm('現在の保存データをバックアップで置き換えますか？')){state=o.state;save();home()}}catch(err){alert('読み込めません：'+err.message)}};r.readAsText(f)}home();</script></body></html>
