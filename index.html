<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>忘れた頃チェック・試作版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#19263c;background:#f2f5fa}body{margin:0}main{max-width:650px;margin:auto;padding:18px 15px 55px}h1{font-size:1.5rem}h2{font-size:1.15rem}.card{background:white;border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 2px 12px #2232 1}.muted{color:#5d6879;font-size:.91rem}.choice{display:block;width:100%;text-align:left;background:white;color:#17253d;border:2px solid #dce3ee;border-radius:12px;padding:14px;margin:9px 0;font-size:1rem;line-height:1.5}.choice.selected{border-color:#2465dc;background:#eaf1ff}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}button{cursor:pointer}button.primary,button.secondary{border:0;border-radius:11px;padding:13px 12px;font-size:1rem;font-weight:650}button.primary{background:#205dcc;color:white}button.secondary{background:#e8eef9;color:#203c6c}button:disabled{opacity:.4}.tag{background:#fff0c2;padding:5px 9px;border-radius:8px;display:inline-block}.hidden{display:none}.check{color:#ad5a08;font-weight:700}.fine{font-size:.85rem;color:#5b6677}.list{border-bottom:1px solid #e1e6ef;padding:11px 0}input[type=checkbox]{width:19px;height:19px;vertical-align:middle}select{font-size:1rem;padding:9px;border-radius:8px;max-width:100%}</style></head><body><main><h1>📘 忘れた頃チェック</h1><p class="muted">日本語教師・確認テスト対策｜動作確認用10問</p><div id="app"></div></main><script>
const questions=[{"id": "demo-1", "stem": "「形態素」の説明として最も適切なのは？", "options": ["文章全体", "意味や文法機能を持つ最小の単位", "必ず一文字の単位", "音声の長さを測る単位"], "correct": 1, "explanation": "意味や文法機能を持つ最小の単位。", "subject": "体験版"}, {"id": "demo-2", "stem": "「音素」の説明として適切なのは？", "options": ["文字の書体", "文節の境界", "意味を区別する音の単位", "文章の長さ"], "correct": 2, "explanation": "意味の違いを区別する音の単位。", "subject": "体験版"}, {"id": "demo-3", "stem": "「母語」とは一般に何を指す？", "options": ["幼少期に自然に習得した言語", "最も最近学んだ言語", "学校でのみ学ぶ言語", "世界で最も話者が多い言語"], "correct": 0, "explanation": "幼少期に自然に習得した言語。", "subject": "体験版"}, {"id": "demo-4", "stem": "「敬語」の説明として適切なのは？", "options": ["方言を使わない表現", "外来語を使う表現", "短い文章だけの表現", "人物や場面に応じて敬意などを表す言語表現"], "correct": 3, "explanation": "人物や場面に応じて敬意などを表す言語表現。", "subject": "体験版"}, {"id": "demo-5", "stem": "「語彙」とは？", "options": ["音の高さ", "ある言語や領域で使われる語の集まり", "文末の記号", "文字の筆順"], "correct": 1, "explanation": "ある言語や領域で使われる語の集まり。", "subject": "体験版"}, {"id": "demo-6", "stem": "「助詞」の一般的な働きは？", "options": ["動詞の時制だけを示す", "文章を必ず終える", "語句間の関係や意味を示す", "固有名詞を作る"], "correct": 2, "explanation": "語句間の関係や意味を示す。", "subject": "体験版"}, {"id": "demo-7", "stem": "「語順」とは？", "options": ["文字の画数", "発音の強弱", "辞書の値段", "文の中で語が並ぶ順序"], "correct": 3, "explanation": "文の中で語が並ぶ順序。", "subject": "体験版"}, {"id": "demo-8", "stem": "「アクセント」に関係するのは？", "options": ["音の高低や強弱の配置", "漢字の部首", "文の段落数", "文字の色"], "correct": 0, "explanation": "音の高低や強弱の配置。", "subject": "体験版"}, {"id": "demo-9", "stem": "「多義語」とは？", "options": ["発音できない語", "一つの語が複数の意味を持つ語", "意味のない語", "二文字だけの語"], "correct": 1, "explanation": "一つの語が複数の意味を持つ語。", "subject": "体験版"}, {"id": "demo-10", "stem": "「同音異義語」とは？", "options": ["意味も表記も必ず同じ語", "発音が必ず異なる語", "発音が同じで意味が異なる語", "外国語だけの語"], "correct": 2, "explanation": "発音が同じで意味が異なる語。", "subject": "体験版"}];const KEY='wasureta_v1';let store;try{store=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){store={}};store.stats ||= {};store.history ||= [];store.hideIntro ||= false;let session=null,screen='home',index=0,mode='exam',finished=false;
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(store));const st=id=>(store.stats[id] ||= {checks:0,mastered:false,attempts:0});
function render(){if(screen==='home')home();else if(screen==='quiz')quiz();else results()}
function home(){let pending=questions.filter(q=>st(q.id).checks>0&&!st(q.id).mastered).length;app.innerHTML=`${!store.hideIntro?`<section class="card"><h2>🎯 学習の約束</h2><p><strong>確信を持って答えられるときだけ選択。</strong>少しでも迷ったら空欄のまま進んでください。</p><p>不正解・空欄は解説を読み、ほかの勉強・食事・休憩などを挟んで、忘れた頃に再挑戦しましょう。再挑戦の時期は自分で決めます。</p><label><input type="checkbox" id="hide"> 今後このメッセージを表示しない</label></section>`:''}<section class="card"><h2>体験版・10問</h2><p>復習待ち：<strong>${pending}問</strong>　｜　履歴：${store.history.length}回</p><div class="row"><button class="primary" id="exam">📝 本番試験モード</button><button class="secondary" id="learn">📖 学習モード</button></div><p><button class="secondary" id="review" ${pending?'':'disabled'}>☑️ 忘れた頃チェック（復習）</button></p><p class="fine">※体験用の独自問題です。科目5の正式問題ではありません。</p></section><section class="card"><h2>学習履歴</h2>${store.history.length?store.history.slice(-6).reverse().map(h=>`<div class="list">${esc(h.date)}｜${esc(h.mode)}｜${h.correct}/${h.total}正解（空欄${h.blank}）</div>`).join(''):'まだ履歴はありません。'}<p class="fine">保存先：このブラウザ内。データ消去・別端末への移動では引き継がれません。</p><button class="secondary" id="showintro">学習の約束を再表示</button></section>`;document.getElementById('hide')?.addEventListener('change',e=>{store.hideIntro=e.target.checked;save()});document.getElementById('exam').onclick=()=>start('exam',false);document.getElementById('learn').onclick=()=>start('learn',false);document.getElementById('review').onclick=()=>start('learn',true);document.getElementById('showintro').onclick=()=>{store.hideIntro=false;save();render()}}
function start(m,review){let pool=review?questions.filter(q=>st(q.id).checks>0&&!st(q.id).mastered).sort((a,b)=>st(b.id).checks-st(a.id).checks):questions;session={ids:pool.map(q=>q.id),answers:{},revealed:{},review,mode:m};mode=m;index=0;screen='quiz';finished=false;render()}
function quiz(){let q=questions.find(q=>q.id===session.ids[index]);let a=session.answers[q.id];let revealed=!!session.revealed[q.id];let isLast=index===session.ids.length-1;app.innerHTML=`<section class="card"><p class="muted">${session.review?'忘れた頃チェック':mode==='exam'?'本番試験モード':'学習モード'}｜${index+1}/${session.ids.length}問</p><h2>${esc(q.stem)}</h2><p class="fine">迷ったら選択せず、空欄のまま次へ。</p>${q.options.map((o,i)=>`<button class="choice ${a===i?'selected':''}" data-i="${i}" ${revealed?'disabled':''}>${'ABCD'[i]}．${esc(o)}</button>`).join('')}<button class="secondary" id="clear" ${revealed?'disabled':''}>選択を取り消して空欄にする</button>${mode==='learn'?`<p><button class="primary" id="reveal" ${revealed?'disabled':''}>この問題の答えと解説を見る</button></p>${revealed?`<div class="card" style="background:#f4f8ff"><strong>${a===q.correct?'正解':'要復習'}｜正解：${'ABCD'[q.correct]}</strong><p>${esc(q.explanation)}</p></div>`:''}`:''}</section><div class="row"><button class="secondary" id="prev" ${index===0?'disabled':''}>← 前へ</button><button class="primary" id="next">${isLast?'採点する':'次へ →'}</button></div><p><button class="secondary" id="home">中断してホームへ</button></p>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{session.answers[q.id]=Number(b.dataset.i);render()});document.getElementById('clear').onclick=()=>{delete session.answers[q.id];render()};document.getElementById('prev').onclick=()=>{index--;render()};document.getElementById('home').onclick=()=>{if(confirm('今回の未採点の解答は破棄されます。よろしいですか？')){screen='home';render()}};document.getElementById('next').onclick=()=>{if(isLast){if(confirm('採点します。未解答の問題は復習対象になります。'))finish()}else{index++;render()}};document.getElementById('reveal')?.addEventListener('click',()=>{session.revealed[q.id]=true;render()})}
function finish(){if(finished)return;finished=true;let correct=0,blank=0,rows=[];for(const id of session.ids){let q=questions.find(q=>q.id===id),a=session.answers[id],ok=a===q.correct;if(ok)correct++;if(a===undefined)blank++;let s=st(id);s.attempts++;if(ok){s.mastered=true}else{s.checks++;s.mastered=false}rows.push({q,a,ok,checks:s.checks,mastered:s.mastered})}store.history.push({date:new Date().toLocaleString('ja-JP'),mode:session.review?'復習':mode==='exam'?'本番':'学習',correct,blank,total:session.ids.length});save();session.rows=rows;screen='results';render()}
function results(){let rows=session.rows,ok=rows.filter(r=>r.ok).length;app.innerHTML=`<section class="card"><h2>採点結果</h2><p style="font-size:1.4rem"><strong>${ok}/${rows.length}問正解</strong></p><p>不正解：${rows.filter(r=>r.a!==undefined&&!r.ok).length}問　空欄：${rows.filter(r=>r.a===undefined).length}問</p><p>今回の要復習：${rows.length-ok}問</p></section><section class="card"><h2>正誤と解説</h2>${rows.map((r,i)=>`<div class="list"><strong>第${i+1}問｜${r.ok?'✅ 正解・卒業':r.a===undefined?'⬜ 空欄・要復習':'❌ 不正解・要復習'}</strong><br>${esc(r.q.stem)}<br><span class="check">累積チェック：${r.checks}</span>${r.mastered&&r.checks?'｜克服済み':''}<p>正解：${'ABCD'[r.q.correct]}．${esc(r.q.options[r.q.correct])}</p><p class="muted">${esc(r.q.explanation)}</p></div>`).join('')}</section><button class="primary" id="back">ホームへ戻る</button>`;document.getElementById('back').onclick=()=>{screen='home';render()}}
render();</script></body></html>
